<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mapa Red Natura 2000</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; }
    #map { height: 100vh; width: 100%; }

    /* Panel lateral */
    #panel {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: white; padding: 12px 14px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3); font-size: 12px; min-width: 210px;
    }
    #panel h3 { font-size: 13px; margin-bottom: 8px; color: #333; }
    #panel label { display: flex; align-items: center; margin: 5px 0; cursor: pointer; gap: 6px; }
    #panel input[type=checkbox] { margin: 0; }
    .dot { display: inline-block; width: 14px; height: 10px; border-radius: 2px; flex-shrink: 0; }
    #panel hr { margin: 8px 0; border: none; border-top: 1px solid #ddd; }
    #panel .note { color: #888; font-size: 10px; line-height: 1.4; }

    /* Popup personalizado */
    .popup-content { font-size: 12px; min-width: 220px; max-width: 320px; }
    .popup-content h4 { font-size: 13px; margin: 0 0 8px; color: #1a5276;
      border-bottom: 2px solid #1a5276; padding-bottom: 4px; }
    .popup-content table { width: 100%; border-collapse: collapse; }
    .popup-content td { padding: 3px 5px; vertical-align: top; }
    .popup-content td:first-child { font-weight: 600; color: #555; white-space: nowrap; width: 40%; }
    .popup-content tr:nth-child(even) { background: #f5f9ff; }
    .popup-source { font-size: 10px; color: #999; margin-top: 6px; text-align: right; }
    .popup-loading { color: #666; font-style: italic; padding: 8px 0; }
    .popup-error { color: #c00; padding: 6px 0; }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 10px;
      font-size: 10px; font-weight: bold; color: white; margin-left: 4px; }
    .badge-zec  { background: #005f87; }
    .badge-zepa { background: #8b0000; }
    .badge-lic  { background: #3a7c59; }
    .badge-spa  { background: #8b4500; }
    .badge-sci  { background: #4a4c8b; }
    .badge-sac  { background: #005f87; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="panel">
    <h3>🌿 Red Natura 2000</h3>
    <label>
      <input type="checkbox" id="chk-eea" checked>
      <span class="dot" style="background:#1a6eb5;opacity:.8"></span>EEA — Todos los espacios
    </label>
    <label>
      <input type="checkbox" id="chk-zec">
      <span class="dot" style="background:#005f87;opacity:.8"></span>MITECO — ZEC
    </label>
    <label>
      <input type="checkbox" id="chk-zepa">
      <span class="dot" style="background:#8b0000;opacity:.8"></span>MITECO — ZEPA
    </label>
    <label>
      <input type="checkbox" id="chk-lic">
      <span class="dot" style="background:#3a7c59;opacity:.8"></span>MITECO — LIC
    </label>
    <hr>
    <div class="note">🖱 Haz clic sobre un espacio para ver sus datos</div>
    <hr>
    <div class="note">⚠ Capas MITECO requieren servidor web</div>
  </div>

  <script>
    function loadCSS(href) {
      var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href;
      document.head.appendChild(l);
    }
    function loadScript(src, cb) {
      var s = document.createElement('script'); s.src = src; s.onload = cb;
      document.head.appendChild(s);
    }

    // Construye la URL GetFeatureInfo para un WMS dado un click del mapa
    function buildGetFeatureInfoURL(wmsUrl, layerName, latlng, map, version, infoFormat) {
      var size   = map.getSize();
      var bounds = map.getBounds();
      var sw     = bounds.getSouthWest();
      var ne     = bounds.getNorthEast();

      // En WMS 1.3.0 el orden del CRS:84 / EPSG:4326 es lat,lon → usamos CRS:84 (lon,lat)
      var bbox = version === '1.3.0'
        ? [sw.lat, sw.lng, ne.lat, ne.lng].join(',')
        : [sw.lng, sw.lat, ne.lng, ne.lat].join(',');

      var crs    = version === '1.3.0' ? 'CRS=CRS:84' : 'SRS=EPSG:4326';
      var iParam = version === '1.3.0' ? 'I' : 'X';
      var jParam = version === '1.3.0' ? 'J' : 'Y';

      // Pixel del clic
      var point = map.latLngToContainerPoint(latlng);

      var params = [
        'SERVICE=WMS',
        'VERSION=' + version,
        'REQUEST=GetFeatureInfo',
        'LAYERS=' + layerName,
        'QUERY_LAYERS=' + layerName,
        'INFO_FORMAT=' + (infoFormat || 'application/json'),
        crs,
        'BBOX=' + bbox,
        'WIDTH=' + size.x,
        'HEIGHT=' + size.y,
        iParam + '=' + Math.round(point.x),
        jParam + '=' + Math.round(point.y),
        'FEATURE_COUNT=5'
      ];
      return wmsUrl + '?' + params.join('&');
    }

    // Renderiza los datos de la EEA (respuesta GeoJSON o GML)
    function renderEEA(data) {
      var features = data && data.features;
      if (!features || features.length === 0) return null;

      var html = '';
      features.forEach(function(f) {
        var p = f.properties || {};
        // Tipo de espacio
        var tipo = p.SITETYPE || p.sitetype || p.SiteType || '';
        var badgeClass = {
          'A': 'badge-spa', 'B': 'badge-sci', 'C': 'badge-sac',
          'SAC': 'badge-sac', 'SPA': 'badge-spa', 'SCI': 'badge-sci'
        }[tipo] || 'badge-zec';
        var tipoLabel = {
          'A': 'SPA/ZEPA', 'B': 'SCI/LIC', 'C': 'SAC/ZEC'
        }[tipo] || tipo;

        html += '<h4>';
        html += (p.SITENAME || p.sitename || p.SiteName || 'Espacio sin nombre');
        if (tipo) html += ' <span class="badge ' + badgeClass + '">' + tipoLabel + '</span>';
        html += '</h4>';
        html += '<table>';

        var campos = [
          ['Código',        p.SITECODE  || p.sitecode  || p.SiteCode],
          ['País',          p.MS        || p.ms        || p.Country],
          ['Región biogeog.',p.REGION_NAME || p.RegionName],
          ['Área (ha)',     p.AREAHA    || p.areaha    || p.AreaHa],
          ['Año designación',p.DESIGNATD || p.Designatd],
          ['Última actualiz.',p.DATECALC  || p.DateCalc],
          ['% marinidad',   p.MARINE_AREA_PERCENTAGE],
          ['Tipo hábitat',  p.HABTYPE   || p.HabType],
        ];
        campos.forEach(function(c) {
          if (c[1] !== undefined && c[1] !== null && c[1] !== '') {
            html += '<tr><td>' + c[0] + '</td><td>' + c[1] + '</td></tr>';
          }
        });
        html += '</table>';
        if (p.SITECODE || p.sitecode) {
          var code = p.SITECODE || p.sitecode;
          html += '<div class="popup-source"><a href="https://natura2000.eea.europa.eu/Natura2000/SDF.aspx?site=' + code + '" target="_blank">📄 Ver ficha estándar (EEA)</a></div>';
        }
      });
      return html || null;
    }

    // Renderiza los datos del MITECO (GML o texto plano)
    function renderMITECO(text) {
      if (!text || text.trim() === '') return null;
      // Intenta parsear GML/XML básico extrayendo campos clave
      var fields = {};
      var tags = ['SITECODE','SITENAME','SITETYPE','AREAHA','DESIGNATD','REGION_NAME','SPECODE'];
      tags.forEach(function(tag) {
        var re = new RegExp('<[^>]*:?' + tag + '[^>]*>([^<]+)<', 'i');
        var m = text.match(re);
        if (m) fields[tag] = m[1].trim();
      });

      if (Object.keys(fields).length === 0) return null;

      var tipo = fields.SITETYPE || '';
      var tipoLabel = { 'A': 'SPA/ZEPA', 'B': 'SCI/LIC', 'C': 'SAC/ZEC' }[tipo] || tipo;
      var badgeClass = { 'A': 'badge-spa', 'B': 'badge-sci', 'C': 'badge-sac' }[tipo] || 'badge-zec';

      var html = '<h4>' + (fields.SITENAME || 'Espacio Natura 2000');
      if (tipoLabel) html += ' <span class="badge ' + badgeClass + '">' + tipoLabel + '</span>';
      html += '</h4><table>';

      var labels = { SITECODE:'Código', SITENAME:'Nombre', AREAHA:'Área (ha)',
                     DESIGNATD:'Designación', REGION_NAME:'Región biogeog.', SPECODE:'Cód. especie' };
      Object.keys(labels).forEach(function(k) {
        if (fields[k]) html += '<tr><td>' + labels[k] + '</td><td>' + fields[k] + '</td></tr>';
      });
      html += '</table>';
      if (fields.SITECODE) {
        html += '<div class="popup-source"><a href="https://natura2000.eea.europa.eu/Natura2000/SDF.aspx?site=' + fields.SITECODE + '" target="_blank">📄 Ver ficha estándar (EEA)</a></div>';
      }
      return html;
    }

    function initMap() {
      var map = L.map('map').setView([40.2, -3.5], 6);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 18
      }).addTo(map);

      var sat = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        { attribution: '© Esri', maxZoom: 18 }
      );

      // ── Capas WMS ──────────────────────────────────────────────
      var EEA_URL    = 'https://bio.discomap.eea.europa.eu/arcgis/services/ProtectedSites/Natura2000Sites/MapServer/WMSServer';
      var MITECO_URL = 'https://wms.mapama.gob.es/sig/Biodiversidad/RedNatura/wms.aspx';
      var wmsBase    = { format:'image/png', transparent:true, opacity:0.65 };

      var layerEEA  = L.tileLayer.wms(EEA_URL,    Object.assign({}, wmsBase, { layers:'0', version:'1.3.0', attribution:'© EEA' }));
      var layerZEC  = L.tileLayer.wms(MITECO_URL, Object.assign({}, wmsBase, { layers:'RN_ZEC',  version:'1.3.0', attribution:'© MITECO' }));
      var layerZEPA = L.tileLayer.wms(MITECO_URL, Object.assign({}, wmsBase, { layers:'RN_ZEPA', version:'1.3.0', attribution:'© MITECO' }));
      var layerLIC  = L.tileLayer.wms(MITECO_URL, Object.assign({}, wmsBase, { layers:'RN_LIC',  version:'1.3.0', attribution:'© MITECO' }));

      layerEEA.addTo(map);

      // Registro de capas activas para saber qué consultar al clicar
      var activeLayers = { eea: true, zec: false, zepa: false, lic: false };

      function bindCheckbox(id, layer, key) {
        document.getElementById(id).addEventListener('change', function() {
          activeLayers[key] = this.checked;
          if (this.checked) layer.addTo(map); else map.removeLayer(layer);
        });
      }
      bindCheckbox('chk-eea',  layerEEA,  'eea');
      bindCheckbox('chk-zec',  layerZEC,  'zec');
      bindCheckbox('chk-zepa', layerZEPA, 'zepa');
      bindCheckbox('chk-lic',  layerLIC,  'lic');

      // ── GetFeatureInfo al hacer clic ───────────────────────────
      var popup = L.popup({ maxWidth: 380, minWidth: 240 });

      map.on('click', function(e) {
        popup.setLatLng(e.latlng)
             .setContent('<div class="popup-content"><div class="popup-loading">⏳ Consultando espacio…</div></div>')
             .openOn(map);

        var promises = [];

        // Consulta a EEA si está activa
        if (activeLayers.eea) {
          var urlEEA = buildGetFeatureInfoURL(EEA_URL, '0', e.latlng, map, '1.3.0', 'application/geojson');
          promises.push(
            fetch(urlEEA)
              .then(function(r) { return r.json(); })
              .then(function(data) { return { source: 'EEA', html: renderEEA(data) }; })
              .catch(function() { return { source: 'EEA', html: null }; })
          );
        }

        // Consulta a MITECO si alguna capa suya está activa
        var mitecoLayers = [];
        if (activeLayers.zec)  mitecoLayers.push('RN_ZEC');
        if (activeLayers.zepa) mitecoLayers.push('RN_ZEPA');
        if (activeLayers.lic)  mitecoLayers.push('RN_LIC');

        if (mitecoLayers.length > 0) {
          var urlMITECO = buildGetFeatureInfoURL(MITECO_URL, mitecoLayers.join(','), e.latlng, map, '1.3.0', 'application/vnd.ogc.gml');
          promises.push(
            fetch(urlMITECO)
              .then(function(r) { return r.text(); })
              .then(function(text) { return { source: 'MITECO', html: renderMITECO(text) }; })
              .catch(function() { return { source: 'MITECO', html: '<span class="popup-error">⚠ MITECO bloqueado por CORS (usa servidor web)</span>' }; })
          );
        }

        if (promises.length === 0) {
          popup.setContent('<div class="popup-content"><div class="popup-error">Activa alguna capa para consultar datos.</div></div>');
          return;
        }

        Promise.all(promises).then(function(results) {
          var combined = '';
          var found = false;
          results.forEach(function(r) {
            if (r.html) {
              combined += '<div class="popup-content">' + r.html;
              combined += '<div class="popup-source">Fuente: ' + r.source + '</div></div>';
              found = true;
            }
          });

          if (!found) {
            combined = '<div class="popup-content"><div class="popup-error">No se encontraron espacios Natura 2000 en este punto.<br><small>Prueba a hacer clic directamente sobre un polígono coloreado.</small></div></div>';
          }

          if (popup.isOpen()) popup.setContent(combined);
        });
      });

      // Control de capa base
      L.control.layers(
        { 'OpenStreetMap': map._layers[Object.keys(map._layers)[0]], 'Satélite': sat },
        {},
        { position: 'bottomright', collapsed: true }
      ).addTo(map);

      L.control.scale({ imperial: false }).addTo(map);
    }

    loadCSS('https://unpkg.com/leaflet@1.9.4/dist/leaflet.css');
    loadScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js', initMap);
  </script>
</body>
</html>
